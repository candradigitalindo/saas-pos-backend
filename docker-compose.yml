# Compose untuk PENGEMBANGAN LOKAL — bukan cetak biru production.
#
# Menyediakan PostgreSQL 16 dengan role non-superuser `pos_app` (RLS wajib —
# lihat deploy/postgres-init.sql), lalu menjalankan migrasi sekali, lalu server.
#
#   docker compose up --build       # migrate → server
#   docker compose run --rm migrate status
#   docker compose run --rm recognize-revenue
#
# Salin .env.example ke .env lebih dulu; nilai DB_* di bawah menimpanya agar
# menunjuk ke service `db`.

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: pos_app
  DB_PASS: pos_app_dev
  DB_NAME: saas_pos
  DB_SSLMODE: disable
  DB_TZ: UTC
  APP_ENV: development

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres        # superuser hanya untuk admin/init
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrasi = langkah deploy TERPISAH (docs/TECHNICAL-BACKEND.md aturan #10).
  migrate:
    build: .
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    env_file: [.env]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  # Opsional: `docker compose --profile redis up` untuk menguji pembatas laju
  # lintas-instance. Tanpa profil ini, server memakai pembatas laju in-memory.
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: .
    env_file: [.env]
    environment:
      <<: *app-env
      APP_PORT: "8080"
      # Diabaikan bila service `redis` tidak dijalankan (URL menunjuk host yang
      # tak ada → fatal saat start); set hanya bersama `--profile redis`.
      # RATELIMIT_REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Pekerjaan terjadwal — jalankan manual atau lewat cron host / scheduler.
  recognize-revenue:
    build: .
    entrypoint: ["/usr/local/bin/recognize-revenue"]
    env_file: [.env]
    environment: *app-env
    profiles: ["jobs"]
    depends_on: { db: { condition: service_healthy } }

  subscription-renewals:
    build: .
    entrypoint: ["/usr/local/bin/subscription-renewals"]
    env_file: [.env]
    environment: *app-env
    profiles: ["jobs"]
    depends_on: { db: { condition: service_healthy } }

  payable-reminders:
    build: .
    entrypoint: ["/usr/local/bin/payable-reminders"]
    env_file: [.env]
    environment: *app-env
    profiles: ["jobs"]
    depends_on: { db: { condition: service_healthy } }

  process-channel-events:
    build: .
    entrypoint: ["/usr/local/bin/process-channel-events"]
    command: ["-loop", "-interval", "10s"]
    env_file: [.env]
    environment: *app-env
    profiles: ["jobs"]
    depends_on: { db: { condition: service_healthy } }

  partner-commissions:
    build: .
    entrypoint: ["/usr/local/bin/partner-commissions"]
    env_file: [.env]
    environment: *app-env
    profiles: ["jobs"]
    depends_on: { db: { condition: service_healthy } }

  # Pengirim notifikasi (pola outbox §5.14). Inilah satu-satunya proses yang
  # benar-benar mengirim WhatsApp; server web tidak pernah mengirim apa pun.
  process-outbox:
    build: .
    entrypoint: ["/usr/local/bin/process-outbox"]
    command: ["-loop", "-interval", "30s"]
    env_file: [.env]
    environment:
      <<: *app-env
      # Kosongkan WA_GATEWAY_URL di .env untuk tetap di mode catat saja.
      WA_GATEWAY_URL: http://wa-gateway:8090
    profiles: ["jobs"]
    depends_on: { db: { condition: service_healthy } }

  # Sidecar WhatsApp (Baileys). Lihat wa-gateway/README.md.
  #
  # Portnya SENGAJA tidak dipublikasikan ke host: siapa pun yang bisa menjangkau
  # layanan ini bisa mengirim WhatsApp atas nama usaha Anda. Cukup dijangkau
  # dari jaringan compose oleh process-outbox.
  #
  # QR penautan muncul di log:  docker compose logs -f wa-gateway
  wa-gateway:
    build: ./wa-gateway
    env_file: [.env]
    environment:
      WA_GATEWAY_HOST: 0.0.0.0
      WA_GATEWAY_PORT: "8090"
      WA_AUTH_DIR: /app/auth
    volumes:
      # WAJIB persisten. Tanpa ini setiap restart meminta pindai QR ulang, dan
      # notifikasi berhenti sampai ada manusia yang memegang ponselnya.
      - wa-auth:/app/auth
    profiles: ["jobs"]
    restart: unless-stopped

volumes:
  pgdata:
  wa-auth:
