name: CI

on:
  push:
    branches: [main]
  pull_request:

# Batalkan run lama pada ref yang sama saat ada push baru.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      # Suite ./tests butuh role NON-SUPERUSER agar RLS (FORCE) benar-benar
      # menjaga isolasi — lihat deploy/postgres-init.sql.
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_USER: pos_app
      TEST_DB_PASS: pos_app_ci
      TEST_DB_NAME: saas_pos_test
      TEST_DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Siapkan role non-superuser + database test
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pos_app LOGIN PASSWORD 'pos_app_ci' NOSUPERUSER NOCREATEROLE CREATEDB;
          CREATE DATABASE saas_pos_test OWNER pos_app;
          SQL
          psql -h localhost -U postgres -d saas_pos_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT ALL ON SCHEMA public TO pos_app;
          ALTER SCHEMA public OWNER TO pos_app;
          SQL

      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)" || { echo "berkas belum ter-format:"; gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test ./... -race -count=1

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Bangun image runtime
        run: docker build --build-arg VERSION=${{ github.sha }} -t saas-pos:ci .
